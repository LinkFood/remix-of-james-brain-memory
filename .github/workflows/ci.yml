name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Setup Deno
        # Required for the Deno type-check step. Pinned major version; minor
        # bumps are safe given allowlist tracks per-file error counts.
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno type check (supabase/functions)
        # Class kill A from 2026-05-06 PR #27 incident retro. PR #25 introduced
        # a ReferenceError on `consumerName` at claudeReadSurface.ts:1983 that
        # the npx tsc step missed (supabase/functions is outside the src/
        # tsconfig graph). This step runs `deno check` against every TS file
        # under supabase/functions/ (except jac-watch-scheduler — npm: imports
        # need nodeModulesDir setup), compares per-file error counts against
        # scripts/check_deno_types.allowlist baseline, and fails on any new
        # error in clean files OR regression in allowlisted files. See
        # docs/audit/2026-05-06-pr25-reference-error-incident-retro.md.
        run: bash scripts/check_deno_types.sh

      - name: Supabase table reference check
        # B4 class-kill from 2026-05-05 distill-principles silent no-op audit.
        # Catches functions that .from('<table>') against a name absent from
        # the live PostgREST schema. Allowlist at
        # scripts/check_supabase_table_refs.allowlist for known false-positives.
        # Skips silently if SUPABASE_SERVICE_ROLE_KEY not configured (e.g.,
        # forks without secrets) — caller should set the secret in repo settings.
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SKIP_TABLE_REF_CHECK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY == '' && '1' || '0' }}
        run: bash scripts/check_supabase_table_refs.sh
